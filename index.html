<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowBoard - Organize your tasks as you wish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:opsz@9..40&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      @theme base {
        --font-sans: "Plus Jakarta Sans", sans-serif;
        --font-serif: "Playfair Display", serif;
        --font-mono: "DM Sans", monospace;
      }
    </style>
  </head>
  <body>
    <header
      class="w-full bg-[#F8FAFC] h-16 flex flex-col md:flex-row items-center justify-between px-4"
    >
      <h1 class="text-[#1E293B] text-lg md:text-2xl font-bold font-sans">Flow Board</h1>
      <ul class="flex items-center justify-between h-full px-4  gap-2 md:gap-4">
        <li class="text-[#475569] w-6 h-6 cursor-pointer">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-search preview-icon"
          >
            <path d="m21 21-4.34-4.34" />
            <circle cx="11" cy="11" r="8" />
          </svg>
        </li>
        <li
          class="flex bg-[#4F46E5] cursor-pointer text-white text-sm items-center justify-center py-1 px-2 h-8 rounded-full gap-1"
        >
          Share
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="lucide lucide-share-2 preview-icon text-sm w-3 h-3"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.59" x2="15.42" y1="13.51" y2="17.49" />
            <line x1="15.41" x2="8.59" y1="6.51" y2="10.49" />
          </svg>
        </li>
        <li
          class="flex w-8 h-8 border border-[#475569] cursor-pointer text-[#475569] items-center justify-center py-1 px-2 rounded-full gap-1"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-file-down preview-icon"
          >
            <path
              d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"
            />
            <path d="M14 2v5a1 1 0 0 0 1 1h5" />
            <path d="M12 18v-6" />
            <path d="m9 15 3 3 3-3" />
          </svg>
        </li>
        <li
          class="flex w-8 h-8 border border-[#475569] cursor-pointer text-[#475569] items-center justify-center py-1 px-2 rounded-full gap-1"
        ><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus preview-icon"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </li>
      </ul>
    </header>

    <main>
        <div class="filter-area bg-[#F1F5F9] w-full h-10 flex items-center justify-center gap-4 px-4 text-sans font-semibold text-[#475569]">
            <select class="text-white border border-[#475569] flex items-center justify-center rounded-full bg-[#4F46E5] px-2 py-1 text-sm">
                <option disabled selected hidden value="all">Priorité</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
            <select class="text-white border border-[#475569] flex items-center justify-center rounded-full bg-[#4F46E5] px-2 py-1 text-sm">
                <option disabled selected hidden value="all">Statut</option>
                <option value="todo">To Do</option>
                <option value="inprogress">In Progress</option>
                <option value="done">Done</option>
            </select>
            <select class="text-white border border-[#475569] flex items-center justify-center rounded-full bg-[#4F46E5] px-2 py-1 text-sm">
                <option disabled selected hidden value="all">Date</option>
                <option value="today">Today</option>
                <option value="thisweek">This Week</option>
                <option value="thismonth">This Month</option>
            </select>
            <div class="flex items-center justify-center gap-2 border border-[#475569] rounded-full px-2 py-1">
                <input type="text" placeholder="Search Keywords..." class="bg-transparent border-none focus:outline-none" />
                <svg class="text-[#475569] w-4 h-4" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>
        <section class="p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-lg shadow">
                    <h2 class="text-lg font-bold mb-2">To Do</h2>
                    <p class="text-gray-600 flex gap-2"><span class="count bg-[#4F46E5] text-white rounded-full h-8 w-8 flex items-center justify-center text-sm relative">0</span>Tasks that need to be done.</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <h2 class="text-lg font-bold mb-2">In Progress</h2>
                    <p class="text-gray-600 flex gap-2"><span class="count bg-[#4F46E5] text-white rounded-full h-8 w-8 flex items-center justify-center text-sm">0</span>Tasks that are currently being worked on.</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <h2 class="text-lg font-bold mb-2">Done</h2>
                    <p class="text-gray-600 flex gap-2"><span class="count bg-[#4F46E5] text-white rounded-full h-8 w-8 flex items-center justify-center text-sm">0</span>Tasks that have been completed.</p>
                </div>
        </section>
    </main>

  </body>
</html>
